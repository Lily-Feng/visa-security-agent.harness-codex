# pipeline configuration
#
# Each model role chooses its own backend:
#   via: cli    → `claude` CLI subprocess (auth: run `claude` then `/login`).
#                 Can provide Read/Glob/Grep/Bash natively, but grants only
#                 tools named in that step's `allowed_tools`. It is the only
#                 detection backend capable of Bash.
#   via: sdk    → Anthropic Python SDK (auth: ANTHROPIC_SDK_API_KEY).
#                 Temperature control + connection pooling. Agentic roles
#                 (preprocess, verify) use a local sandboxed Read/Glob/Grep
#                 tool-loop — no Bash.
#   via: openai → OpenAI Chat Completions API (auth: OPENAI_API_KEY).
#                 Same agentic Read/Glob/Grep tool-loop as `sdk`; no Bash.
#
# A bare string (e.g. `deepdive: claude-opus-4-7`) is still accepted and
# defaults to `via: cli` for backward compatibility.

models:
  # ── SDK-key profile ──────────────────────────────────────────────────────────────
  # Every model role is configured with via:sdk. Model-backed detection through
  # S8 uses the Anthropic Python SDK; S9 is deterministic. S10 translates
  # ANTHROPIC_SDK_API_KEY for the bundled Claude Agent SDK. S11 also uses that
  # Harness and pins external `claude`, but does not translate the SDK-named
  # credential; it uses Claude login/OAuth or ANTHROPIC_API_KEY /
  # ANTHROPIC_AUTH_TOKEN. A standard key can cover the whole runtime because
  # sole-SDK detection accepts it as fallback.
  # Step 0 and step1.call_graph are omitted: S0 is disabled and S1 inherits
  # the regex graph. Use default.yaml or taint.yaml for shipped tree-sitter S0/S1.
  # Unlike the all-cli detection path in default.yaml, the S4 SDK backend
  # honours `temperature`, so the temperature-capable Sonnet 4.6 deepdive below
  # enables repeated-run majority voting (step4.runs / vote_threshold).
  autoexclude: {id: claude-sonnet-4-6, via: sdk}  # auto-exclude survey (per-target Step-1 overlay)
  preprocess:  {id: claude-sonnet-4-6, via: sdk}  # Step-1 deterministic repo walk (file inventory, call graph, config dedup)
  threatmodel: {id: claude-sonnet-4-6, via: sdk}  # Step-2 threat model (assets, trust boundaries, ranked threats)
  decompose:   {id: claude-sonnet-4-6, via: sdk}  # Step-3 decompose (entry→sink data flow, risk/catchall/specialist packing)
  deepdive:    {id: claude-sonnet-4-6, via: sdk, temperature: 0.4}  # Step-4 deep dive (risk/catchall/specialist chunk analysis); T>0 enables step4 majority voting (runs/vote_threshold)
  verify:      {id: claude-sonnet-4-6, via: sdk}  # Step-6 adversarial verification (one verifier per finding)
  dedup:       {id: claude-sonnet-4-6, via: sdk}  # Step-7 deduplication (deterministic + semantic)
  chain:       {id: claude-sonnet-4-6, via: sdk}  # Step-8 chain pass (finding synthesis, report assembly)

  # Step 10: enabled both in `scan` and through standalone `remediate`. It
  # selects up to step_remediate.top_n_findings, can edit target source in fix
  # mode, and writes artefacts under <repo>/security-remediation/.
  remediate:   {id: claude-opus-4-8, via: sdk}

  # models.validate: used by enabled in-scan S11 and standalone `validate`.
  # via:sdk here selects the Claude Agent SDK Harness, with the S11 auth/binary
  # requirements documented in the profile header above.
  validate:
    orchestrator:       {id: claude-sonnet-4-6, via: sdk}
    security_architect: {id: claude-opus-4-8}
    penetration_tester: {id: claude-sonnet-4-6}
    cross_repo_analyzer: {id: claude-sonnet-4-6}


sdk:
  # Primary direct-SDK credential. In this SDK-only profile, runtime can fall
  # back to ANTHROPIC_API_KEY / ANTHROPIC_AUTH_TOKEN. Never hardcode a value.
  api_key: ${ANTHROPIC_SDK_API_KEY}
  base_url:   ${ANTHROPIC_SDK_BASE_URL}
  verify_ssl: true
  ca_cert:     ${ANTHROPIC_SDK_CA_CERT}     # absolute CA path; direct SDK detection only
  client_cert: ${ANTHROPIC_SDK_CLIENT_CERT} # absolute mTLS cert path; direct SDK detection only

openai:
  # Required for via:openai roles. Set in .env — NEVER hardcode here.
  api_key:    ${OPENAI_API_KEY}
  base_url:   ${OPENAI_BASE_URL}
  verify_ssl: true
  ca_cert:    ${OPENAI_CA_CERT}        # absolute CA path; direct via:openai only
  # organization: org-xxxx

cli:
  # Optional TLS/proxy for direct via:cli roles; this profile configures no
  # detection role that way. S11 nevertheless pins an external `claude`, using
  # standard Anthropic/Claude auth and process trust rather than cli.ca_cert.
  # Direct CLI auth/endpoint precedence is Claude login, CLAUDE_CODE_OAUTH_TOKEN,
  # and ANTHROPIC_BASE_URL.
  verify_ssl: true
  ca_cert:    ${CLAUDE_CLI_CA_CERT}    # absolute CA path -> NODE_EXTRA_CA_CERTS
  # client_cert: unavailable here; only direct SDK detection exposes configured mTLS.
  # Reasoning effort pinned for the `claude -p` subprocess so the scan never
  # inherits the operator's interactive /effort default (e.g. 'xhigh', which
  # some models reject). Opus-tier models support high|low|max|medium.
  effort: high

step1:
  # ── AI auto-exclude (per-target Step-1 overlay) ──
  # When true, after each clone the harness AI-surveys the target and derives a
  # per-target exclude overlay (dirs/exts/globs) BEFORE s1 — same behaviour as
  # the --auto-step1 CLI flag. Flag and config OR together; --no-auto-step1
  # hard-disables for a run; --step1-config still wins over both.
  auto_exclude: true
  auto_exclude_max_tokens: 8000     # output cap for the auto-exclude survey call (models.autoexclude)

  # ── Agentic-phase quality vs cost ──
  max_budget_usd: 25.0              # retained for parity; this profile's raw SDK S1 does not enforce it

  max_turns: 40                     # tool-loop cap for via:sdk/via:openai; forwarded
                                    # when an installed via:cli build supports it.
                                    # Raise it for large repos where exploration force-finalises at the cap.

  allowed_tools:                    # tools the explorer may use. Read/Glob/Grep
                                    # are sufficient for repo survey on every
                                    # backend. Bash is intentionally NOT listed
                                    # (prompt-injection → host shell risk on
                                    # untrusted targets); add it ONLY if you
                                    # accept that risk for a trusted repo.
    - Read
    - Glob
    - Grep

  # Deterministic repo walk (ground-truth file inventory).
  # These APPEND to the built-in defaults in vvaharness/pipeline/stages/s1_preprocess.py — they
  # don't replace them. Leave null/[] for defaults only.
  # App/repo-specific exclusions come from --step1-config <file> or are
  # auto-derived per target by --auto-step1. Keep ONLY org-wide,
  # language-agnostic noise here.
  exclude_dirs:
    - .vs
    - .settings                    # Eclipse IDE metadata
    - .vscode
    - .idea                        # IntelliJ IDE metadata
    - node_modules
   
  exclude_exts:
    # compiled / packaged binaries (complements built-in .exe/.dll/.so/.jar/.class/.o/.a/.obj)
    - .msi
    - .nupkg
    - .pdb
    - .lib
    - .aar
    - .ser
    - .pbix
    # binary keystores / certs (.pem stays in scope — text, may hold secrets)
    - .p12
    - .pfx
    - .jks
    - .der
    - .cer
    # office binaries
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .xlsm
    - .bmp
    # opaque data stores
    - .sqlite
    - .db
  exclude_globs:
    - "**/._*"                            # macOS resource forks
    
  max_file_kb: 1024                       # skip files larger than this (catches data dumps; lets normal CSV/JSON through)

  # Deterministic call-graph hardening (runs AFTER the agentic exploration):
  # Nodes are file-qualified (`rel/path.ext::name`) so save()/process() in
  # different files don't collide in BFS / connected-components / neighbor ctx.
  call_graph_validate: true        # drop agent-emitted caller/callee names that don't appear in any source file
  call_graph_supplement: true      # regex-scan source for calls to known fns; iteratively expand edges
  call_graph_rounds: 4             # max expansion rounds (each round adds newly-discovered callers as targets)
  call_graph_max_targets: 3        # when a bare callee resolves to N def-sites, keep top-N by dir-prefix affinity to caller

  # Structural dedup of per-environment config files (yml/json/ini/…).
  # Clusters files with identical key-structure, keeps one representative
  # per cluster (per top-level dir), and force-keeps any dropped file that
  # contains a literal secret or insecure value. Repo-agnostic — no path
  # assumptions. Set enabled: false to disable.
  config_dedup:
    enabled: true
    min_cluster_size: 5            # only dedup if ≥N files share identical key-shape
    keep_per_top_dir: true         # keep ≥1 representative per first-level dir
    promote_on_secret_hit: true    # never drop a file containing a literal credential
    promote_on_insecure_value: true  # …or verify:false / auth:none / debug:true etc.

step2:                              # threat-model (assets, trust boundaries, ranked threats)
  enabled: true                     # set false to skip threat modelling entirely
  max_tokens: 64000
  max_threats: 50                   # cap on emitted ranked threats
  baseline: auto                    # auto | owasp | none — inject kind-specific minimum-threat checklist (OWASP/CWE/MASVS/IaC)
  max_doc_chars: 20000              # README/SECURITY/ARCHITECTURE budget
  max_manifest_chars: 4000          # per-manifest cap (pom.xml, package.json, …)
  # Evidence caps for the s1-derived blocks (s2 runs AFTER s1):
  max_modules: 100                   # ctx.modules[] lines in the prompt
  max_entry_points: 400             # ctx.entry_points[] (STRIDE-tagged) lines
  max_config_reps: 80               # representative config files (post-dedup)
  max_api_artefacts: 100             # openapi/swagger/proto/graphql/wsdl/META-INF

step3:
  max_tokens: 64000
  timeout: 3600                     # seconds; forwarded as the Anthropic SDK stream-request timeout
  taint_chunks: true                # emit entry→sink data-flow chunks (taint-NN) ranked above LLM risk chunks
  taint_max_hops: 10                 # max call-graph depth when walking entry→sink
  taint_max_chunks: 60              # cap on emitted taint chunks
  taint_files_per_hop: 5            # max files per hop fn (ranked by package-affinity to entry/sink); 0 = uncapped
  pack_by: loc                      # loc | tokens — shard-boundary metric for risk/catchall/specialist packing.
                                    #   loc    → legacy: respects risk_chunk_loc / catchall_chunk_loc / specialist_chunk_loc below (back-compat default)
                                    #   tokens → single budget: cuts at (chunk_token_budget − chunk_overhead_tokens) × 4 bytes; *_chunk_loc caps ignored
  chunk_token_budget: 180000        # (pack_by: tokens) model context window available to one s4 prompt
  chunk_overhead_tokens: 80000      # (pack_by: tokens) reserved for SYSTEM + RESEARCH-LENS + neighbor-ctx + step4.max_tokens output
  
  risk_chunk_loc: 10000             # split LLM-emitted chunk-NN into chunk-NN-a/b/… if total LOC exceeds this (0 = off)
  catchall_enabled: true            # emit catchall-NN coverage-sweep chunks for files no risk/taint chunk claimed (off for giant 3rd-party trees e.g. Hadoop)
  catchall_chunk_loc: 4000          # max LOC per auto-generated coverage chunk
  catchall_max_files: 100           # file cap for catch-all packing (separate from specialists)
  max_files_per_chunk: 80           # hard cap for risk/specialist chunks
  specialists:                      # repo-wide specialist passes appended after risk chunks
    - crypto
    - logic-bug
    - access-control
    - batch-etl
    - iac                           # Terraform/Dockerfile/k8s/Helm/GH-Actions/Ansible — gated off if no IaC files present
  specialist_chunk_loc: 10000       # shard specialist scope by this many LOC
  threat_surface_fallbacks: true    # add deterministic threat-tagged fallback chunks when threats remain uncovered
  threat_fallback_max_files: 12     # per-threat file cap for fallback chunk candidate selection

step4:
  parallel: 5                       # concurrent chunks processed at once (1 = sequential)
  timeout: 1800                     # seconds; forwarded as the Anthropic SDK stream-request timeout
  runs: 3                           # repeat each chunk N×; CLI and SDK models known to reject `temperature` auto-collapse to 1. OpenAI retains N runs.
  vote_threshold: 2                 # finding must appear in ≥N runs to survive → drops T>0 hallucinations
  specialist_runs: 1                # specialist chunks run once (s6 verifies them)
  line_bucket: 10                   # canonical key buckets lines to +/- this many
  max_findings_per_run: 10          # keep top-N by confidence per run
  max_tokens: 64000                 # output token cap per deep-dive run
  neighbor_context_lines: 25        # ±lines of out-of-chunk callers/callees appended to each prompt (0 = off)
  neighbor_context_max: 50          # cap on neighbor excerpts per chunk

step5_prefilter:                    # deterministic gates applied BEFORE s6 verify
  # These gates complement s4 majority voting (enabled in this profile): they
  # drop hallucinated / unproven findings before paying the per-finding s6
  # verifier budget. (They are the *primary* FP defence in profiles where voting
  # is off — the all-cli default.yaml, or a known temperature-rejecting SDK model.)
  min_pre_confidence: 0.6           # drop s4 findings with self-rated confidence below this
  require_evidence: true            # drop findings missing source_ref or sink_ref (data flow unproven)
  # Legacy: these two knobs used to live under `step6_verify`. s5 still reads
  # there as a fallback for older configs.

step6_verify:                       # adversarial verification (one verifier per finding)
  parallel: 5                       # concurrent verifier subprocesses (429 backoff is automatic)
  min_confidence: 7                 # TRUE_POSITIVE below this → dropped as UNCONFIRMED
  max_budget_usd: 10.0              # retained for parity; raw SDK verifier does not enforce it
  max_turns: 30                     # verifier tool-loop cap
  allowed_tools:
    - Read
    - Glob
    - Grep

step7_dedup:                        # deduplication (deterministic + semantic)
  line_tolerance: 3                 # trivial-dup line distance (was 10 — too wide; collapsed distinct sinks in same method)
  semantic: true                    # set false to skip the LLM dedup pass
  max_tokens: 64000

step8:
  max_tokens: 64000
  timeout: 3600                     # seconds; forwarded as the Anthropic SDK stream-request timeout

step_remediate:                     # Remediation Agent — ON by default. Set `enabled: false` to opt out (`--remediate` forces on).
  enabled: true
  enforce_policy: false             # opt-in: deny-list/playbook gate + diff post-gate (revert forbidden-path edits)
  # Optional rule overrides; null uses the files bundled with the installation.
  #policy_file: null
  #playbook_file: null

  top_n_findings: 5                # top-N by CVSS — bounds cost on large reports (source of truth; --top N overrides ad-hoc; set 'all'/'*'/null to remediate EVERY finding)
  max_budget_usd: 10.0              # per-finding Claude Agent SDK spend cap
  max_turns: 40                     # per-finding Claude Agent SDK turn cap
  allowed_tools:                    # fix mode needs file-write — Edit/Write are
                                    # used instead of Bash so the agent can apply
                                    # diffs without a host shell. cwd-confined.
    - Read
    - Glob
    - Grep
    - Edit
    - Write

step_validate:                      # s11 validator — ON by default (mirrors step_remediate). Set `enabled: false` to opt out.
  enabled: true
  effort: high                      # Claude Agent SDK reasoning effort
  max_turns: 50                     # validation-panel turn cap
  max_budget_usd: 15.0              # validation-panel spend cap
  max_findings: 20                  # top-N validatable (awaiting_validation / needs_review / validation_failed) by CVSS; --all bypasses, --finding ignores
  allowed_tools:                    # reviewer-persona tools for inspecting remediated code (read-only).
                                    # The parent may use Agent to launch personas; persona
                                    # tools are only the readers below. Write/Edit/Bash are denied.
    - Read
    - Grep
    - Glob

inject:
  # Optional external context. Relative paths resolve against this profile's
  # directory, not the target repo; use absolute paths in a copied profile.
  # Missing files safely mean no injected CVEs, controls, or CMDB context.
  cve_file:       ./inputs/known_cves.json
  controls_file:  ./inputs/design_controls.yaml
  # Single CMDB export. Optional: if unset or the file is absent, VulContextSeverity environmental scoring is skipped
  # (CVSS base + OffensivePriority are still computed). No legacy fallback.
  
  cmdb_file:      ./inputs/cmdb.csv
  # Remediation policy/playbook overrides (read by step_remediate's policy gate).
  # Paths resolve against this config's directory; unset = bundled repo-root inputs/.
  policy_file:    ./inputs/remediation_policy.yaml
  playbook_file:  ./inputs/remediation_playbook.yaml
batch:
  # PAT for cloning private repos over HTTPS in --repo-file mode.
  # Injected as https://x-access-token:<PAT>@host/org/repo.git
  # Leave blank to fall back to git's own credential helper / SSH.
  git_token: ${GITHUB_TOKEN}
  # Base clone URL used when a .csv batch row supplies only (AppID, RepoName).
  # RepoName is the full repo slug → {git_base_url}/{RepoName}.git
  git_base_url: ${GIT_BASE_URL}
  # Rows whose RepoName matches any of these case-insensitive globs are
  # dropped at parse time — never cloned, never scanned. Use for UI-test /
  # automation / perf harnesses that have no production attack surface.
  skip_repo_patterns:
    - "*automation*"
    - "*-playwright*"
    - "*-selenium*"
    - "*-karate*"
    - "*perf-script*"
    - "*perf-test*"
    - "*test-buddy*"
    - "*-e2e*"
    - "*-mock-*"

scan_progress:
  # ── Real-time file/chunk-level progress tracking ────────────────────────
  # Emits S0-S9 stage lifecycle lines plus detailed S1 discovery, S2 notes,
  # S3 queueing, and S4 chunk/result/summary lines to stderr. Report output is
  # unaffected.
  #
  # Environment variable override: VVAHARNESS_SCAN_PROGRESS_ENABLED=1
  enabled: false
  # compact: lifecycle lines plus notable file lists; verbose: every file;
  # summary_only: only the final S4 summary block (which may span several lines).
  style: compact    # compact | verbose | summary_only

output:
  # Folders inside the clone kept when source is purged after a scan (the
  # cloned source is deleted unless --keep-clones). Checkpoints live in
  # $VVAHARNESS_STATE_DIR (~/.vvaharness/state), not the clone, so --resume
  # is unaffected by cleanup.
  preserve_on_cleanup: [security-scan, security-remediation]
